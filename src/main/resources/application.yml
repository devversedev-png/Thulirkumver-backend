spring:
  application:
    name: thulirkum-ver-bookstore
  data:
    mongodb:
      uri: ${MONGODB_URI}

server:
  port: ${PORT:8080}

app:
  jwt-secret: ${JWT_SECRET}
  cors-origin: ${CORS_ALLOWED_ORIGIN}
  admin-name: ${ADMIN_NAME}
  admin-email: ${ADMIN_EMAIL}
  admin-password: ${ADMIN_PASSWORD}
